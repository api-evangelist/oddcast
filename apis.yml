name: Oddcast
description: >-
  Oddcast is a New York-based creative media technology company that builds
  speaking-character, avatar, and text-to-speech products for agencies, brands,
  business, and education. For developers it operates two API-driven products:
  Vocalware, a pay-as-you-go cloud text-to-speech service exposed as an HTTP/REST
  API and a JavaScript/HTML5 API with hundreds of voices across more than thirty
  languages; and SitePal, an AI avatar platform whose speaking characters are
  embedded and controlled at runtime through a JavaScript (VHost) API for speech,
  facial expression, background, and AI-assistant integration. Both products are
  self-service with free trials, per-stream/per-download pricing, and published
  developer references.
