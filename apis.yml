- name: SitePal Avatar API
  description: >-
    SitePal is Oddcast's AI avatar platform. Speaking characters are embedded on a
    web page or app and controlled at runtime through a JavaScript (VHost) API with
    methods such as sayText, sayAudio, sayAI, stopSpeech, setStatus,
    setFacialExpression, and setBackground, plus AI-assistant integration and
    text-to-speech. Delivered as an embeddable client-side component rather than a
    server-side REST API.
  humanURL: https://www.sitepal.com
  baseURL: https://www.sitepal.com
  tags:
  - Avatars
  - Text-to-Speech
  - JavaScript
  - Embeddable
