apis:
- name: Vocalware Text-to-Speech API
  description: >-
    Vocalware is Oddcast's cloud text-to-speech service. It exposes a pay-as-you-go
    HTTP/REST API (suitable for mobile and server-side/standalone apps) and a
    JavaScript/HTML5 API (for in-browser playback), offering hundreds of voices in
    over thirty languages. Requests are authenticated with an account id and API
    key plus a per-request checksum; audio is returned as a playable stream (a
    stream is one playback instance up to 60 seconds).
  humanURL: https://www.vocalware.com
  baseURL: https://www.vocalware.com
  tags:
  - Text-to-Speech
  - Speech Synthesis
  - Voice
  - Audio
